input {
  http {
    port => "${LOGSTASH_PORT}"
    codec => json
    user => "${LOGSTASH_USER}"
    password => "${LOGSTASH_PASSWORD}"
  }
}

filter {
}

output {
  elasticsearch {
    index => "logstash-%{+YYYY.MM.dd}"
    hosts => "${ELASTIC_HOSTS}"
    user => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    ssl => true
    ssl_certificate_verification => true
    cacert => "/usr/share/logstash/certs/ca/ca.crt"
  }
}